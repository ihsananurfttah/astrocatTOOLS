<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Tools Kz</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

<header class="hero">

    <video
        id="heroVideo"
        autoplay
        muted
        loop
        playsinline>

        <!-- GANTI URL VIDEO DI SINI -->
        <source src="VIDEO_URL.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

    <div class="creator-card">

        <div class="profile">

            <img src="https://i.imgur.com/ZQZSWrt.png">

        </div>

        <div class="info">

            <h1>All Tools AstroCat</h1>

            <span>Kazo Senpai</span>

            <div class="grid">

                <div>
                    <i class="fa-solid fa-globe"></i>
                    <small>NEGARA</small>
                    <p id="country">Memuat...</p>
                </div>

                <div>
                    <i class="fa-solid fa-mobile-screen"></i>
                    <small>DEVICE</small>
                    <p id="device"></p>
                </div>

                <div>
                    <i class="fa-brands fa-chrome"></i>
                    <small>BROWSER</small>
                    <p id="browser"></p>
                </div>

                <div>
                    <i class="fa-solid fa-signal"></i>
                    <small>STATUS</small>
                    <p class="online">
                        ● Online
                    </p>
                </div>

            </div>

            <div class="battery">

                <i class="fa-solid fa-battery-half"></i>

                <div class="battery-bar">

                    <div id="batteryFill"></div>

                </div>

                <span id="batteryText">
                    --
                </span>

            </div>

        </div>

    </div>

</header>

<section class="tools">

<h2>Semua Tools</h2>

<p>
Bagian ini nanti berisi semua tools.
</p>

</section>

<script src="script.js"></script>

</body>
</html>
